<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SessionShield Social</title>
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="brand"><span class="shield">🛡</span> SessionShield</a>
    <div class="nav-links">
      <a href="app.html" class="active">Home</a>
      <a href="attack-demo.html">Security</a>
      <a href="#" id="logoutLink">👤 Logout</a>
    </div>
  </div>

  <div class="container">
    <div class="welcome-row fade-in" style="margin-bottom: 22px;">
      <h2 class="mt-0 mb-0" id="welcomeText">Welcome 👋</h2>
      <span class="badge badge-active" id="statusBadge">● ACTIVE</span>
    </div>

    <div class="app-layout">
      <!-- LEFT: Profile + Session panel -->
      <div>
        <div class="card">
          <div class="profile-head">
            <div class="avatar" id="avatarInitial">?</div>
            <div>
              <h3 class="mt-0 mb-0" id="profileName">—</h3>
              <div class="text-muted small" id="profileHandle">@—</div>
            </div>
          </div>
          <p class="small text-muted" id="profileBio">—</p>
          <div class="stats-row">
            <div class="stat"><span class="num" id="followersVal">0</span><span class="label">Followers</span></div>
            <div class="stat"><span class="num" id="followingVal">0</span><span class="label">Following</span></div>
            <div class="stat"><span class="num" id="postsVal">0</span><span class="label">Posts</span></div>
          </div>
        </div>

        <div class="card">
          <h3 class="mt-0">🔐 Current Session</h3>
          <div class="banner banner-warning">
            ⚠️ DEMO SESSION ID — this identifier exists only inside this local educational application.
          </div>
          <div class="field-row"><span class="k">Status</span><span id="sessStatus">● ACTIVE</span></div>
          <div class="field-row"><span class="k">Authenticated As</span><span id="sessAuthAs">—</span></div>
          <div class="field-row"><span class="k">Session ID</span><span class="mono" id="sessId">—</span></div>
          <div class="field-row"><span class="k">Created</span><span id="sessCreated">—</span></div>
          <div class="field-row"><span class="k">Last Activity</span><span id="sessLastActivity">—</span></div>
          <button class="btn btn-outline" id="copySessionBtn" style="margin-top:14px; width:100%; justify-content:center;">Copy Demo Session ID</button>
          <div class="small" style="color: var(--success); margin-top:8px; display:none; text-align:center;" id="copiedMsg">✓ Copied</div>
        </div>
      </div>

      <!-- RIGHT: Feed -->
      <div>
        <div class="card">
          <h3 class="mt-0">Feed</h3>
          <div id="feedContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
