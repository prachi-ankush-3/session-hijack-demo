<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — SessionShield</title>
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="brand"><span class="shield">🛡</span> SessionShield</a>
  </div>

  <div class="login-wrap">
    <div class="login-header fade-in">
      <div class="shield">🛡</div>
      <h2 class="mt-0">Welcome to SessionShield Social</h2>
    </div>

    <div class="card pop-in">
      <div id="loginError" class="login-error"></div>
      <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="off" required />
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="off" required />
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Login</button>
      </form>

      <div class="demo-accounts">
        <div class="label">Demo Accounts</div>
        <div class="demo-account-row">
          <span><strong>USER A</strong><br/><span class="who">alice</span></span>
          <span class="mono">alice123</span>
        </div>
        <div class="demo-account-row">
          <span><strong>USER B</strong><br/><span class="who">bob</span></span>
          <span class="mono">bob123</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
