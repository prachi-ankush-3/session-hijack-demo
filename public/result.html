<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulation Result — SessionShield</title>
<link rel="stylesheet" href="css/global.css" />
<link rel="stylesheet" href="css/result.css" />
</head>
<body>
  <div class="topbar">
    <a href="index.html" class="brand"><span class="shield">🛡</span> SessionShield</a>
    <div class="nav-links">
      <a href="app.html">Home</a>
      <a href="attack-demo.html">Security</a>
    </div>
  </div>

  <div class="container">
    <div class="card fade-in result-hero">
      <div class="big-icon" id="resultIcon">🚨</div>
      <h1 class="mt-0" id="resultTitle">SESSION HIJACKING RISK</h1>
      <p class="text-muted" id="resultSubtitle">
        The demo application accepted a previously valid session identifier.
      </p>
    </div>

    <div class="card center">
      <h3 class="mt-0">Security Risk</h3>
      <div class="risk-score-display" id="riskScoreVal">— / 100</div>
      <div style="margin-top:8px;">
        <span class="badge" id="riskLevelBadge">—</span>
      </div>
      <div class="risk-meter" style="margin-top:16px;">
        <div class="risk-meter-fill" id="riskMeterFill" style="width:0%;"></div>
      </div>
    </div>

    <div class="card">
      <h3 class="mt-0">Security Event Timeline</h3>
      <ul class="timeline" id="eventsTimeline">
        <li><span class="time">—</span> No events yet.</li>
      </ul>
    </div>

    <div class="card center">
      <a href="attack-demo.html" class="btn btn-outline">Back to Risk Lab</a>
      <a href="app.html" class="btn btn-primary">Back to App</a>
    </div>
  </div>

  <script src="js/result.js"></script>
</body>
</html>
